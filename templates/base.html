<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#0d0618"/>
  <title>Our Love Journey ❤️</title>

  <!-- Google Fonts: Playfair Display + Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>

  <style>
    /* ═══════════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════════ */
    :root {
      --bg:          #0d0618;
      --bg2:         #160a2a;
      --bg3:         #1f0f3a;
      --pink:        #ff69b4;
      --pink-light:  #ffb6c1;
      --pink-dark:   #c2185b;
      --purple:      #c084fc;
      --purple-dark: #7c3aed;
      --gold:        #f9c74f;
      --text:        #f5e6ff;
      --text-muted:  #b39ddb;
      --card-bg:     rgba(255,105,180,0.07);
      --card-border: rgba(192,132,252,0.25);
      --glow-pink:   0 0 20px rgba(255,105,180,0.4);
      --glow-purple: 0 0 20px rgba(192,132,252,0.4);
      --radius:      16px;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'Lato', sans-serif;
    }

    /* ═══════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: var(--pink); text-decoration: none; }
    img { max-width: 100%; display: block; border-radius: var(--radius); }

    /* ═══════════════════════════════════════════════
       LOADING SCREEN
    ═══════════════════════════════════════════════ */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loading-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-heart {
      font-size: 64px;
      animation: loading-pulse 1.2s ease-in-out infinite;
    }
    .loading-text {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--pink);
      letter-spacing: 0.08em;
    }
    .loading-bar-wrap {
      width: 200px; height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px; overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      border-radius: 99px;
      animation: loading-bar 1.8s ease forwards;
    }
    @keyframes loading-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    @keyframes loading-bar { from{width:0%} to{width:100%} }

    /* ═══════════════════════════════════════════════
       FLOATING HEARTS CANVAS
    ═══════════════════════════════════════════════ */
    #hearts-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .fheart {
      position: absolute; bottom: -80px;
      font-size: 20px;
      animation: float-up linear infinite;
      opacity: 0;
      user-select: none;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) rotate(0deg);  opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* ═══════════════════════════════════════════════
       PROGRESS BAR
    ═══════════════════════════════════════════════ */
    #progress-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 4px;
      background: rgba(255,255,255,0.05);
    }
    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pink-dark), var(--pink), var(--purple));
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--glow-pink);
    }

    /* ═══════════════════════════════════════════════
       MUSIC TOGGLE
    ═══════════════════════════════════════════════ */
    #music-toggle {
      position: fixed; top: 14px; right: 16px; z-index: 200;
      background: rgba(255,105,180,0.15);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.2s;
    }
    #music-toggle:hover { background: rgba(255,105,180,0.3); transform: scale(1.1); }

    /* ═══════════════════════════════════════════════
       TYPOGRAPHY HELPERS
    ═══════════════════════════════════════════════ */
    .display { font-family: var(--font-display); }
    .italic  { font-style: italic; }
    .gradient-text {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ═══════════════════════════════════════════════
       BUTTON
    ═══════════════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 50px;
      font-family: var(--font-body); font-size: 1rem; font-weight: 700;
      cursor: pointer; border: none; outline: none;
      transition: transform 0.18s, box-shadow 0.18s;
      position: relative; overflow: hidden;
      letter-spacing: 0.04em;
    }
    .btn::after {
      content:''; position:absolute; inset:0;
      background: rgba(255,255,255,0.12);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--pink-dark), var(--purple-dark));
      color: #fff;
      box-shadow: 0 4px 24px rgba(194,24,91,0.4);
    }
    .btn-primary:hover { box-shadow: 0 8px 32px rgba(194,24,91,0.6); }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--pink);
      color: var(--pink);
    }
    .btn-outline:hover { background: rgba(255,105,180,0.1); }

    /* ═══════════════════════════════════════════════
       CARD
    ═══════════════════════════════════════════════ */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      padding: 28px 24px;
    }

    /* ═══════════════════════════════════════════════
       TYPEWRITER
    ═══════════════════════════════════════════════ */
    .typewriter { overflow: hidden; white-space: pre-wrap; word-break: break-word; }
    .typewriter::after {
      content: '|';
      color: var(--pink);
      animation: blink 0.8s step-end infinite;
    }
    .typewriter.done::after { display: none; }
    @keyframes blink { 50%{opacity:0} }

    /* ═══════════════════════════════════════════════
       CONFETTI (JS-driven, CSS rules)
    ═══════════════════════════════════════════════ */
    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      top: -10px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9000;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ═══════════════════════════════════════════════
       FIREWORKS
    ═══════════════════════════════════════════════ */
    .firework {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 8000;
      animation: fw-burst 0.8s ease-out forwards;
    }
    @keyframes fw-burst {
      0%   { transform: scale(0); opacity: 1; }
      70%  { opacity: 0.8; }
      100% { transform: scale(20); opacity: 0; }
    }

    /* ═══════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════ */
    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ═══════════════════════════════════════════════
       TOAST NOTIFICATION
    ═══════════════════════════════════════════════ */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(20, 8, 40, 0.95);
      border: 1px solid var(--pink);
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 0.9rem; color: var(--text);
      z-index: 9998; pointer-events: none;
      transition: transform 0.4s cubic-bezier(.4,0,.2,1);
      text-align: center; max-width: 90vw;
      box-shadow: var(--glow-pink);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ═══ LOADING SCREEN ═══ -->
<div id="loading-screen">
  <div class="loading-heart">💖</div>
  <div class="loading-text">Loading your love story…</div>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
</div>

<!-- ═══ FLOATING HEARTS BG ═══ -->
<div id="hearts-canvas"></div>

<!-- ═══ PROGRESS BAR ═══ -->
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<!-- ═══ MUSIC TOGGLE ═══ -->
<button id="music-toggle" title="Toggle music" aria-label="Toggle music">🎵</button>
<audio id="bg-music" loop preload="none">
  <source src="/static/{{ final_level.background_music }}" type="audio/mpeg"/>
</audio>

<!-- ═══ TOAST ═══ -->
<div id="toast"></div>

<!-- ══════════════ PAGE CONTENT ══════════════ -->
{% block content %}{% endblock %}

<!-- ═══ SHARED SCRIPTS ═══ -->
<script>
/* ── Config passed from Flask ── */
const CONFIG = {
  startDate:       "{{ start_date }}",
  partnerName:     "{{ partner }}",
  yourName:        "{{ yours }}",
  level4Correct:   {{ level4.correct_index }},
  level5Phrase:    "{{ level5.phrase }}",
  finalSurprise:   "{{ final_surprise.custom_message }}",
};

/* ── Loading screen ── */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("loading-screen").classList.add("hide");
  }, 1800);
});

/* ── Floating hearts ── */
(function(){
  const canvas  = document.getElementById("hearts-canvas");
  const emojis  = ["❤️","💕","💖","💗","💓","💝","🌸","✨","💫"];
  const count   = window.innerWidth < 600 ? 12 : 22;
  for(let i=0;i<count;i++){
    const h = document.createElement("div");
    h.className = "fheart";
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left     = Math.random()*100 + "vw";
    h.style.fontSize = (12 + Math.random()*24) + "px";
    const dur = 8 + Math.random()*14;
    h.style.animationDuration = dur + "s";
    h.style.animationDelay   = -(Math.random()*dur) + "s";
    canvas.appendChild(h);
  }
})();

/* ── Music toggle ── */
(function(){
  const btn   = document.getElementById("music-toggle");
  const audio = document.getElementById("bg-music");
  let playing = false;
  btn.addEventListener("click", () => {
    playing ? audio.pause() : audio.play().catch(()=>{});
    playing = !playing;
    btn.textContent = playing ? "🔇" : "🎵";
  });
})();

/* ── Toast ── */
function showToast(msg, duration=3000){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), duration);
}

/* ── Confetti ── */
function launchConfetti(count=80){
  const colors = ["#ff69b4","#c084fc","#f9c74f","#ff4d6d","#a78bfa","#fff"];
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left            = Math.random()*100+"vw";
      p.style.background      = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (1.5+Math.random()*2)+"s";
      p.style.animationDelay    = Math.random()*0.8+"s";
      p.style.width = p.style.height = (6+Math.random()*8)+"px";
      p.style.borderRadius = Math.random()>0.5?"50%":"2px";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 3500);
    }, Math.random()*600);
  }
}

/* ── Fireworks ── */
function launchFireworks(count=10){
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const fw = document.createElement("div");
      fw.className = "firework";
      fw.style.left    = (20+Math.random()*60)+"vw";
      fw.style.top     = (10+Math.random()*50)+"vh";
      fw.style.background = `hsl(${Math.random()*360},100%,60%)`;
      document.body.appendChild(fw);
      setTimeout(()=>fw.remove(), 900);
    }, i*180);
  }
}

/* ── Typewriter ── */
function typeWriter(el, text, speed=40){
  return new Promise(resolve=>{
    el.textContent = "";
    el.classList.remove("done");
    let i=0;
    const timer = setInterval(()=>{
      el.textContent += text[i++];
      if(i===text.length){ clearInterval(timer); el.classList.add("done"); resolve(); }
    }, speed);
  });
}

/* ── Progress bar ── */
function setProgress(pct){
  document.getElementById("progress-fill").style.width = pct + "%";
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
