{% extends "base.html" %}
{% block content %}

<style>
  .egg-wrap {
    position: relative; z-index: 10;
    min-height: 100vh; padding: 60px 20px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 24px;
  }
  .egg-icon {
    font-size: 80px;
    animation: spin-bounce 2s ease-in-out infinite;
  }
  @keyframes spin-bounce {
    0%,100%{transform:rotate(-10deg) scale(1)} 50%{transform:rotate(10deg) scale(1.15)}
  }
  .egg-title {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 6vw, 2.4rem); font-style: italic;
    background: linear-gradient(135deg, #f9c74f, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .rainbow-border {
    background: linear-gradient(var(--bg3), var(--bg3)) padding-box,
                linear-gradient(135deg, #f9c74f, var(--pink), var(--purple), var(--pink)) border-box;
    border: 2px solid transparent;
    border-radius: var(--radius); padding: 24px 28px;
    max-width: 440px;
  }
</style>

<div class="egg-wrap">
  <div class="egg-icon">🥚✨</div>
  <h1 class="egg-title">{{ easter_egg.title }}</h1>

  <div class="rainbow-border">
    <p style="font-family:var(--font-display); font-style:italic; font-size:1.05rem; line-height:1.8; color:var(--text);">
      {{ easter_egg.message }}
    </p>
  </div>

  <img src="/static/{{ easter_egg.image }}" alt="Easter egg" style="max-width:320px; border-radius:var(--radius); box-shadow:var(--glow-pink); margin-top:8px;"/>

  <a href="/" class="btn btn-outline">← Back Home</a>
</div>

{% endblock %}
{% block scripts %}
<script>
  launchConfetti(60);
  launchFireworks(8);
</script>
{% endblock %}
